<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PharmaHelper</title>
</head>
<body>
    <h1>PharmaHelper</h1>
    <h2>Каталог препаратов</h2>

    {% for drug in drugs %}
        <div>
            <h3>{{ drug.name }}</h3>
            <p>Латинское название: {{ drug.latin_name }}</p>
            <p>Родительный падеж: {{ drug.latin_genitive }}</p>
            <p>Форма: {{ drug.dosage_form }}</p>
        </div>
        <hr>
    {% empty %}
        <p>Препаратов пока нет.</p>
    {% endfor %}
</body>
</html>
